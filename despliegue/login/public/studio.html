<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Mind Videos</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/styles.css?v=10">
  <link rel="stylesheet" href="/css/login.css?v=10">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <!-- A ESTA PANTALLA SE LLEGA cuando hay sesion pero el estudio de la cuenta
       todavia no esta listo (recien aprobada: asvs-cuentas lo esta montando).
       Pregunta cada pocos segundos y entra sola en cuanto lo esta. -->
  <main class="login">
    <div class="login__inner">
      <div class="login__brand">
        <span class="brand brand--mind">
          <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><ellipse cx="32" cy="32" rx="27" ry="15" transform="rotate(32 32 32)" stroke="#a78bfa" stroke-width="3.6"/><ellipse cx="32" cy="32" rx="27" ry="15" transform="rotate(-32 32 32)" stroke="#fff" stroke-width="3.6"/><path d="M28 24.5 40 32l-12 7.5z" fill="#a78bfa"/></svg></span>
          <span class="brand__text"><b>mind</b><small>videos</small></span>
        </span>
      </div>
      <div class="card">
        <div class="card__head">
          <h1 class="card__title" id="titulo">Preparando tu estudio…</h1>
          <p class="card__sub" id="texto">Estamos montando tu espacio. Entrarás solo en cuanto esté listo (menos de un minuto).</p>
        </div>
        <div class="espera"><span class="spinner" aria-hidden="true"></span></div>
        <button class="btn btn--ghost" type="button" id="logout">Cerrar sesión</button>
      </div>
    </div>
  </main>
  <script src="/js/studio.js?v=10"></script>
</body>
</html>
